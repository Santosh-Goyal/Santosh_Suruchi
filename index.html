<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe3ec" />
    <title>For You 🤍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-dawn">
    <!-- Sky: cross-fading theme layers (light -> dusk -> night) -->
    <div class="sky">
      <div class="sky__layer sky__layer--dawn"></div>
      <div class="sky__layer sky__layer--dusk"></div>
      <div class="sky__layer sky__layer--ember"></div>
      <div class="sky__layer sky__layer--night"></div>
      <div class="sky__stars" id="stars"></div>
      <div class="sky__vignette"></div>
    </div>
    <canvas id="fx" class="fx"></canvas>

    <!-- audio toggle -->
    <button id="audioBtn" class="audio-btn" aria-label="Toggle music" title="Music">
      <span class="audio-btn__wave"><i></i><i></i><i></i><i></i></span>
    </button>

    <main id="stage" class="stage">
      <!-- SCENE: INTRO (light) -->
      <section class="scene scene--intro is-active" data-scene="intro">
        <div class="intro">
          <div class="intro__heart">🤍</div>
          <p class="intro__kicker">hey, you</p>
          <h1 class="intro__title">I made you<br />a little something.</h1>
          <p class="intro__sub">No occasion. Just you on my mind. Give me two minutes?</p>
          <button class="btn btn--solid" data-next="her">Begin</button>
        </div>
      </section>

      <!-- SCENE: HER (light) — smile, beauty, smartness, caring, cuteness -->
      <section class="scene scene--her" data-scene="her">
        <div class="card card--light" id="herCard">
          <span class="card__tag" id="herTag"></span>
          <p class="card__line" id="herText"></p>
          <div class="card__dots" id="herDots"></div>
          <button class="btn btn--solid" id="herNext">Next</button>
        </div>
      </section>

      <!-- SCENE: PIVOT — the mood turns -->
      <section class="scene scene--pivot" data-scene="pivot">
        <div class="pivot">
          <p class="pivot__line" id="pivotLine"></p>
          <button class="btn btn--ghost" data-next="dark">
            Come here
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 12h12l-5-5 1.5-1.5L21 12l-7.5 7.5L12 18l5-5H5z"/></svg>
          </button>
        </div>
      </section>

      <!-- SCENE: DARK (night) — the sleepless nights -->
      <section class="scene scene--dark" data-scene="dark">
        <div class="card card--dark" id="darkCard">
          <span class="card__tag" id="darkTag"></span>
          <p class="card__line" id="darkText"></p>
          <div class="card__dots" id="darkDots"></div>
          <button class="btn btn--solid" id="darkNext">Next</button>
        </div>
      </section>

      <!-- SCENE: ASK (night) — the button trick -->
      <section class="scene scene--ask" data-scene="ask">
        <div class="ask">
          <div class="ask__heart">❤</div>
          <h2 class="ask__q" id="askQuestion">Will you let me go crazy again?</h2>
          <div class="ask__btns" id="askBtns">
            <button class="btn btn--yes" id="yesBtn">Always 💥</button>
            <button class="btn btn--no" id="noBtn">No</button>
          </div>
        </div>
      </section>

      <!-- SCENE: FINALE -->
      <section class="scene scene--finale" data-scene="finale">
        <div class="finale">
          <h1 class="finale__title" id="finaleTitle">LET'S GO CRAZY</h1>
          <p class="finale__lines" id="finaleLines"></p>
          <button class="btn btn--ghost" id="replayBtn">Run it back ↺</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
